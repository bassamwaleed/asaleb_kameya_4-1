        .quiz-card {

            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);

        }

        h2 {
            color: #4a4a4a;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .question-number {
            background: #764ba2;
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.9em;
            margin-bottom: 15px;
            display: inline-block;
        }

        .question {
            font-size: 1.4em;
            margin-bottom: 30px;
            color: #2c3e50;
            font-weight: bold;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            padding: 18px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1em;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.2s ease;
            color: #555;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f8f9fa;
            border-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .option-btn:disabled {
            cursor: default;
            transform: none;
        }

        .option-btn.correct {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }

        .score-area {
            margin-top: 25px;
            font-weight: bold;
            color: #764ba2;
            font-size: 1.1em;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: #764ba2;
        }

        /* شريط التقدم */
        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
          /* زر الواتساب العائم */
        .whatsapp-float {
            position: fixed;
            width: 60px;
            height: 60px;
            bottom: 30px;
            right: 30px;
            background-color: #25d366;
            color: #FFF;
            border-radius: 50%;
            text-align: center;
            font-size: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .whatsapp-float:hover {
            background-color: #128c7e;
            transform: scale(1.1);
        }
    </style>

        function checkAnswer(selectedIndex, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const correctIndex = questions[currentQuestion].a; // استخدام a بدلاً من answer
