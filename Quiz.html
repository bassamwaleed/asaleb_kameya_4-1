            "o": ["x = 2, y = 1", "x = 3, y = 0", "x = 1, y = 2", "لا يوجد حل"],
            "a": 0
        },
        {
            "t": "أي من الخيارات التالية يمثل قيودًا في البرمجة الخطية؟",
            "o": ["Z=3x+4y", "x+2y≤10", "Z≥2x+y", "Z=x^2+y^2"],
            "a": 1
        },
        {
            "t": "ما هي النقطة التي يتم عندها الوصول إلى الحل الأمثل في البرمجة الخطية؟",
            "o": ["النقاط التي تحقق القيود وتصلح لدالة الهدف", "النقاط التي تتجاوز القيود", "النقاط داخل المنطقة المظللة التي تحتوي على كل الحلول", "النقاط العشوائية داخل النظام"],
            "a": 0
        },
        ];

        // تعيين الأرقام التعريفية للأسئلة
        originalQuestions.forEach((q, index) => {
            q.id = index + 1;
        });

        // مصفوفة الأسئلة الحالية (قابلة للتغيير)
        let questions = [...originalQuestions];
        let currentQuestion = 0;
        let score = 0;
        let isRandom = false; // حالة الترتيب
        let wrongAnswers = []; // لتخزين الإجابات الخاطئة

        // تحديث العدد الكلي للأسئلة
        document.getElementById('q-total').innerText = questions.length;

        // دالة تبديل الترتيب
        function toggleShuffle() {
            isRandom = !isRandom;
            const btn = document.getElementById('shuffle-btn');
            
            if (isRandom) {
                // خلط الأسئلة
                for (let i = questions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [questions[i], questions[j]] = [questions[j], questions[i]];
                }
                btn.innerHTML = "<span>🔀</span> ترتيب الأسئلة: عشوائي";
                btn.classList.add('active');
            } else {
                // إعادة الترتيب الأصلي
                questions = [...originalQuestions];
                btn.innerHTML = "<span>🔢</span> ترتيب الأسئلة: مرتب";
                btn.classList.remove('active');
            }

            // إعادة ضبط الاختبار
            restartQuiz();
        }

        // دالة إعادة تشغيل الاختبار عند تغيير الترتيب
        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            wrongAnswers = []; // تصفير الأخطاء عند إعادة الاختبار
            document.getElementById('quiz-container').innerHTML = `
                <div class="question" id="question-text">جاري تحميل الأسئلة...</div>
                <div class="options" id="options-container"></div>
                <div class="score-area" id="score-text">النتيجة: 0</div>
            `;
            loadQuestion();
        }

        function loadQuestion() {
            const q = questions[currentQuestion];
            // عرض رقم السؤال المرتبط بالسؤال (q.id)
            document.getElementById('question-text').innerText = q.id + ". " + q.t;
            document.getElementById('q-curr').innerText = currentQuestion + 1;
            
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            // الحروف العربية للاختيارات
            const letters = ['أ', 'ب', 'ج', 'د'];

            q.o.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                // إضافة الحرف (أ، ب، ج، د) قبل نص الاختيار
                btn.innerText = `${letters[index]} - ${opt}`;
                btn.onclick = () => checkAnswer(index, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const correctIndex = questions[currentQuestion].a;

            if (selectedIndex === correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allBtns[correctIndex].classList.add('correct');
                
                // تسجيل الإجابة الخاطئة
                wrongAnswers.push({
                    q: questions[currentQuestion].t,
                    selected: questions[currentQuestion].o[selectedIndex],
                    correct: questions[currentQuestion].o[correctIndex],
                    qNum: questions[currentQuestion].id // استخدام الرقم الأصلي
                });
            }

            document.getElementById('score-text').innerText = `النتيجة: ${score} من ${questions.length}`;

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            }, 1500);
        }

        function showFinalResult() {
            document.getElementById('progress-fill').style.width = '100%';
            
            let resultHTML = `
                <h3>🎉 انتهى الامتحان!
                    متنسانيش بدعوه حلوه و صلي علي النبي</h3>
                <p style="font-size:1.5em; margin: 20px 0;">نتيجتك النهائية: <br> <strong>${score}</strong> من <strong>${questions.length}</strong></p>
                <button class="option-btn" onclick="restartQuiz()" style="background:#764ba2; color:white; border:none;">إعادة الاختبار</button>
            `;

            // زر عرض الأخطاء إذا وجدت
            if (wrongAnswers.length > 0) {
                resultHTML += `
                    <br>
                    <button class="option-btn" onclick="showMistakes()" style="background:#e74c3c; color:white; border:none; margin-top: 10px;">عرض الإجابات الخاطئة</button>
                `;
            }

            document.getElementById('quiz-container').innerHTML = resultHTML;
        }

        function showMistakes() {
            let mistakesHTML = `<h3>ملخص الأخطاء</h3><div class="mistakes-container">`;
            
            wrongAnswers.forEach(item => {
                mistakesHTML += `
                    <div class="mistake-item">
                        <div class="mistake-q">س${item.qNum}: ${item.q}</div>
                        <div class="mistake-wrong">❌ إجابتك: ${item.selected}</div>
                        <div class="mistake-correct">✅ الصح: ${item.correct}</div>
                    </div>
                `;
            });

            mistakesHTML += `</div><button class="option-btn" onclick="restartQuiz()" style="background:#764ba2; color:white; border:none; margin-top: 15px;">إعادة الاختبار</button>`;
            
            document.getElementById('quiz-container').innerHTML = mistakesHTML;
        }

        loadQuestion();
    </script>

</body>
</html>
